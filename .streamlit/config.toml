# Mathbuddy design system (spec 777). The look of every screen comes from here
# and from design.py / design.css. Light and dark follow the device setting.
# Modern and clean: neutral greys, one copper accent, one font (Inter).

[client]
toolbarMode = "minimal"

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap, monospace"
baseFontSize = 16
baseRadius = "12px"
buttonRadius = "12px"
headingFontSizes = ["2.1rem", "1.7rem", "1.25rem", "1.1rem", "1rem", "0.92rem"]
headingFontWeights = [700, 700, 700, 600, 600, 600]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 700
showWidgetBorder = true
chartCategoricalColors = ["#B4532A", "#78716C", "#2563EB", "#16A34A", "#D97706", "#A8A29E", "#0891B2", "#DC2626"]

[theme.light]
primaryColor = "#B4532A"
backgroundColor = "#FAFAF9"
secondaryBackgroundColor = "#F5F5F4"
textColor = "#1C1917"
linkColor = "#963F1C"
borderColor = "#E7E5E4"
codeBackgroundColor = "#F5F5F4"
codeTextColor = "#963F1C"
dataframeHeaderBackgroundColor = "#F5F5F4"
redColor = "#DC2626"
orangeColor = "#EA580C"
yellowColor = "#D97706"
greenColor = "#16A34A"
blueColor = "#2563EB"
violetColor = "#7C3AED"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F4"

[theme.dark]
primaryColor = "#E0814F"
backgroundColor = "#0C0A09"
secondaryBackgroundColor = "#211D1B"
textColor = "#FAFAF9"
linkColor = "#F0A57A"
borderColor = "#2E2926"
codeBackgroundColor = "#211D1B"
codeTextColor = "#F0A57A"
dataframeHeaderBackgroundColor = "#211D1B"
redColor = "#F87171"
orangeColor = "#FB923C"
yellowColor = "#FBBF24"
greenColor = "#4ADE80"
blueColor = "#3B82F6"
violetColor = "#A78BFA"

[theme.dark.sidebar]
backgroundColor = "#171412"
secondaryBackgroundColor = "#211D1B"
